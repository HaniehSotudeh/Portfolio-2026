<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,300&display=swap" rel="stylesheet">
  <style>
    body{margin:0;background:#151515;}
    a{color:#fff;text-decoration:none;}
    a:hover{color:rgba(255,255,255,0.6);}
    ::selection{background:#fff;color:#151515;}

<div style="background:#151515;color:#fff;font-family:'Lato',sans-serif;min-height:100vh;width:100%;box-sizing:border-box;display:flex;flex-direction:column;">

  <nav style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;padding:22px 32px;margin:15px;">
    <a href="Home.dc.html" style="display:flex;flex-direction:column;line-height:1.3;">
      <span style="font-size:20px;font-weight:700;letter-spacing:0.01em;">Hanieh Sotudeh</span>
      <span style="font-size:12px;font-weight:300;opacity:0.6;">Architect</span>
    </a>
    <div style="display:flex;gap:28px;align-items:center;font-size:13px;letter-spacing:0.04em;text-transform:uppercase;">
      <a href="CV.dc.html">CV</a>
      <a href="#" style="opacity:1;border-bottom:1px solid #fff;padding-bottom:2px;">School Projects</a>
      <a href="Professional Work.dc.html">Professional Work</a>
      <a href="Parametric Fun.dc.html">Parametric Fun</a>
    </div>
  </nav>

  <div style="flex:1;">
    <div style="max-width:1080px;margin:0 auto;padding:20px 24px 120px;box-sizing:border-box;{{ viewStyle }}">

      <div style="text-align:center;padding:40px 0 10px;">
        <h1 style="font-size:32px;font-weight:300;letter-spacing:0.02em;margin:0 0 10px;">School Projects</h1>
        <div style="font-size:14px;opacity:0.55;letter-spacing:0.03em;">Projects during B.Arch, M.Arch | 2018 – 2022</div>
      </div>

      <div style="display:flex;justify-content:center;flex-wrap:wrap;gap:6px;padding:30px 0 40px;">
        <sc-for list="{{ filters }}" as="f" hint-placeholder-count="4">
          <div onClick="{{ f.onClick }}" style="cursor:pointer;padding:10px 20px 12px;font-size:12px;font-weight:600;letter-spacing:0.03em;text-transform:uppercase;border-radius:50px;background:{{ f.bg }};color:{{ f.color }};transition:background .2s,color .2s;">{{ f.label }}</div>
        </sc-for>
      </div>

      <div style="display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;">
        <sc-for list="{{ filteredProjects }}" as="p" hint-placeholder-count="6">
          <a href="{{ p.href }}" target="{{ p.target }}" style="cursor:pointer;position:relative;overflow:hidden;border-radius:2px;display:block;grid-column:span {{ p.span }};aspect-ratio:{{ p.frameRatio }};background:#1c1c1c;">
            <div style="position:absolute;inset:0;transition:transform .5s cubic-bezier(.16,1,.3,1),filter .4s ease;filter:grayscale(1);--title-op:0.5;" style-hover="transform:scale(1.06);filter:grayscale(0);--title-op:1;">
              <image-slot id="{{ p.thumbId }}" shape="rect" fit="cover" placeholder="{{ p.title }}" src="{{ p.thumbSrc }}" style="width:100%;height:100%;"></image-slot>
            </div>
            <div style="position:absolute;left:0;right:0;bottom:0;top:55%;pointer-events:none;background:linear-gradient(to top, rgba(0,0,0,0.82), rgba(0,0,0,0));"></div>
            <div style="position:absolute;left:16px;right:16px;bottom:14px;pointer-events:none;">
              <div style="font-size:18px;font-weight:600;color:#fff;line-height:1.25;opacity:var(--title-op,0.5);transition:opacity .4s ease;">{{ p.title }}</div>
              <div style="font-size:10px;color:rgba(255,255,255,0.7);margin-top:4px;letter-spacing:0.03em;text-transform:uppercase;">{{ p.subtitle }}</div>
            </div>
          </a>
        </sc-for>
      </div>
    </div>
  </div>

  <footer style="padding-top:32px;background:#151515;">
    <div style="text-align:center;padding:32px 0 12px;color:#888;font-size:13px;">© 2026 Copyright Text ~ Designed by Hanieh Sotudeh and Claude Design</div>
    <div style="display:flex;justify-content:center;gap:14px;padding:14px 0 34px;">
      <a href="https://www.linkedin.com/in/hsotudeh/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" style="display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,0.25);color:#fff;opacity:0.75;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.36V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z"></path></svg>
      </a>
      <a href="mailto:hanieh.sotudeh10@gmail.com" aria-label="Email" style="display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,0.25);color:#fff;opacity:0.75;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m2 6 10 7L22 6"></path></svg>
      </a>
    </div>
  </footer>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const PROJECTS = [
  { slug:'Awareness', title:'Awareness', category:'Architectural', subtitle:'Environmental EcoCamp · Fall 2019', thumbSrc:'assets/img/Project/Awareness/awarness cover.jpg', ratio:1300/1388 },
  { slug:'ConnectedTo', title:'Connected to ...', category:'Architectural', subtitle:'Multidisciplinary Research Center · Fall 2022', thumbSrc:'assets/img/Project/ConnectedTo/Image1-final-.png', ratio:1510/1500 },
  { slug:'Hypermnesia', title:'Hypermnesia', category:'Architectural', subtitle:'Cultural and Sport Center · Spring 2018', thumbSrc:'assets/img/Project/Hypermnesia/hypermnesia cover.jpg', ratio:1826/2000 },
  { slug:'ComfortZone', title:'Comfort Zone', category:'Architectural', subtitle:'Four House · Fall 2018', thumbSrc:'uploads/1-new.png', ratio:1692/1966 },
  { slug:'DigitalClay', title:'Digital Clay', category:'Product Design', subtitle:'Robotic Scripting · Summer 2020', thumbSrc:'assets/img/Project/Digital Clay/2-1.jpg', ratio:1839/1998 },
  { slug:'Flexibility', title:'Flexibility', category:'Product Design', subtitle:'Height-Adjustable Desk · Summer 2020', thumbSrc:'assets/img/Project/Flexibility/2.png', ratio:882/839 },
  { slug:'Sparkle', title:'Sparkle', category:'Computational', subtitle:'Pavilion Design · Fall 2021', thumbSrc:'uploads/final.png', ratio:2046/2171 },
  { slug:'Chain', title:'Chain', category:'Computational', subtitle:'Surface Active Structure · Summer 2019', thumbSrc:'assets/img/Project/Chain/Cover2.png', ratio:2000/1334 },
  { slug:'TheContainerAndTheContained', title:'The Container & The Contained', category:'Architectural', subtitle:'Nanoscale Pop-Up Museum · Spring 2022', thumbSrc:'assets/img/Project/TheContainerAndTheContained/MONET SHOT-1-1.png', ratio:2000/1652 },
  { slug:'VirginiaFalls', title:'Virginia Falls', category:'Computational', subtitle:'Parametric Facade Design · Summer 2021', thumbSrc:'assets/img/Project/Virginia Falls/2022-12-26 17.21.10.jpg', ratio:540/720 },
  { slug:'FloatingCircles', title:'Floating Circles', category:'Computational', subtitle:'Parametric Ceiling Design · Summer 2020', thumbSrc:'assets/img/Project/Floating Circles/Cover.jpg', ratio:848/1087 },
  { slug:'EverydayAcoustics', title:'Everyday Acoustics', category:'Computational', subtitle:'Acoustic Panel Design · Fall 2022', thumbSrc:'uploads/Screenshot 2026-08-02 at 1.20.54 PM.png', ratio:1230/1544, external:'https://www.everydayacoustics.com/' }
];

const CATEGORIES = ['All','Architectural','Computational','Product Design'];

// A 12-column grid. Spans are chosen to suit each image's orientation, then every
// tile's frame ratio is derived from its own image so the crop stays shallow.
const COLS = 12;
const MAX_ROW_H = 11;      // row height ceiling, in column units
const MIN_ROW_H = 3.2;     // row height floor, so no row reads as thumbnails

class Component extends DCLogic {
  state = { activeFilter: 'All', viewEntered: false };

  componentDidMount() {
    requestAnimationFrame(() => this.setState({ viewEntered: true }));
  }

  // Group the list into rows whose spans total 12, giving wide images wide slots.
  // Even spans for a row of n tiles, so no tile is ever left alone at full width.
  evenSpans(n) {
    if (n <= 1) return [COLS];
    if (n === 2) return [6, 6];
    if (n === 3) return [4, 4, 4];
    if (n === 4) return [3, 3, 3, 3];
    return new Array(n).fill(Math.floor(COLS / n));
  }

  rowsFor(list) {
    const groups = [];
    let i = 0;
    while (i < list.length) {
      const left = list.length - i;
      const wide = list[i].ratio >= 1.3;
      let spans;
      if (left === 1) spans = [list[i].ratio >= 1.3 ? 8 : 6];
      else if (left === 2) spans = wide ? [8, 4] : [6, 6];
      else if (wide) spans = [8, 4];
      else if (list[i + 1] && list[i + 1].ratio >= 1.3) spans = [4, 8];
      else spans = [4, 4, 4];
      groups.push(spans.map((s, k) => ({ item: list[i + k], span: s })));
      i += spans.length;
    }
    // An orphan trailing tile folds into the previous row instead of going full width.
    if (groups.length > 1 && groups[groups.length - 1].length === 1) {
      const orphan = groups.pop();
      const merged = groups.pop().concat(orphan);
      const spans = this.evenSpans(merged.length);
      groups.push(merged.map((c, k) => ({ item: c.item, span: spans[k] })));
    }
    return groups;
  }

  // One row height (as a fraction of a single column) keeps tiles flush; each
  // tile's aspect-ratio is then width/height, so nothing is squeezed.
  cellsFor(list) {
    const out = [];
    this.rowsFor(list).forEach((row) => {
      const widths = row.map((c) => c.span);
      // height that best fits every image in the row at its natural proportion
      let h = row.reduce((sum, c, k) => sum + widths[k] / c.item.ratio, 0) / row.length;
      h = Math.min(h, MAX_ROW_H);
      h = Math.max(h, MIN_ROW_H);
      row.forEach((c, k) => out.push({ span: c.span, frameRatio: widths[k] / h }));
    });
    return out;
  }

  renderVals() {
    const activeFilter = this.state.activeFilter;
    const list = activeFilter === 'All' ? PROJECTS : PROJECTS.filter(p => p.category === activeFilter);
    const cells = this.cellsFor(list);
    const filteredProjects = list.map((p, i) => ({
      ...p,
      thumbId: 'thumb-' + p.slug,
      href: p.external || (p.slug + '.dc.html'),
      target: p.external ? '_blank' : '_self',
      span: cells[i].span,
      frameRatio: cells[i].frameRatio.toFixed(4)
    }));
    const viewStyle = this.state.viewEntered
      ? 'opacity:1;transform:translateY(0);transition:opacity .55s ease,transform .55s ease;'
      : 'opacity:0;transform:translateY(20px);transition:opacity .55s ease,transform .55s ease;';
    return {
      filters: CATEGORIES.map(c => ({
        label: c, onClick: () => this.setState({ activeFilter: c }),
        bg: c === activeFilter ? '#f6f0f0' : 'transparent',
        color: c === activeFilter ? '#000' : '#fff'
      })),
      filteredProjects,
      viewStyle
    };
  }
}

</script>
</body>
</html>
