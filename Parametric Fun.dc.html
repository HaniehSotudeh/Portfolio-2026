    </a>
    <div style="display:flex;gap:28px;align-items:center;font-size:13px;letter-spacing:0.04em;text-transform:uppercase;">
      <a href="CV.dc.html">CV</a>
      <a href="School Projects.dc.html">School Projects</a>
      <a href="Professional Work.dc.html">Professional Work</a>
      <a href="#" style="opacity:1;border-bottom:1px solid #fff;padding-bottom:2px;">Parametric Fun</a>
    </div>
  </nav>

  <div style="flex:1;">
    <div style="max-width:1080px;margin:0 auto;padding:20px 24px 120px;box-sizing:border-box;{{ viewStyle }}">

      <div style="text-align:center;padding:40px 0 10px;">
        <h1 style="font-size:32px;font-weight:300;letter-spacing:0.02em;margin:0 0 10px;">Parametric Fun</h1>
        <div style="font-size:14px;opacity:0.55;letter-spacing:0.03em;">Small Scripting Exercises</div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;padding-top:36px;">
        <sc-for list="{{ items }}" as="p" hint-placeholder-count="6">
          <div style="position:relative;overflow:hidden;border-radius:2px;background:#1c1c1c;grid-column:span {{ p.span }};aspect-ratio:{{ p.frameRatio }};">
            <div style="position:absolute;inset:0;transition:transform .5s cubic-bezier(.16,1,.3,1);" style-hover="transform:scale(1.06);">
              <image-slot id="{{ p.thumbId }}" shape="rect" fit="cover" placeholder="{{ p.title }}" src="{{ p.thumbSrc }}" style="width:100%;height:100%;"></image-slot>
            </div>
            <div style="position:absolute;left:0;right:0;bottom:0;top:55%;pointer-events:none;background:linear-gradient(to top, rgba(0,0,0,0.82), rgba(0,0,0,0));"></div>
            <div style="position:absolute;left:14px;right:14px;bottom:12px;pointer-events:none;">
              <div style="font-size:15px;font-weight:600;color:#fff;line-height:1.25;">{{ p.title }}</div>
              <div style="font-size:10px;color:rgba(255,255,255,0.7);margin-top:3px;letter-spacing:0.03em;">{{ p.subtitle }}</div>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <footer style="padding-top:32px;background:#151515;">

        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.36V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>
      </a>
      <a href="mailto:hanieh.sotudeh10@gmail.com" aria-label="Email" style="display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,0.25);color:#fff;opacity:0.75;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 6 10 7L22 6"/></svg>
      </a>
    </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const ITEMS = [
  { title:'Berlin Holocaust Memorial', subtitle:'Parametric Camp Youtube Channel', thumbSrc:'assets/img/Parametric Fun/Content/Berlin-Holocust.gif', ratio:450/1179 },
  { title:"L'Umbracle Terraza", subtitle:'Parametric Camp Youtube Channel', thumbSrc:'assets/img/Parametric Fun/Content/Lambda.gif', ratio:600/1578 },
  { title:'StairCase', subtitle:'Advanced Scripting Elective Course', thumbSrc:'assets/img/Parametric Fun/Content/Stair.gif', ratio:600/1590 },
  { title:'Exploding Brick Wall', subtitle:'Parametric Camp Youtube Channel', thumbSrc:'assets/img/Parametric Fun/Content/Brick-Explosion.gif', ratio:336/890 },
  { title:'Koch Snowflake', subtitle:'Parametric Camp Youtube Channel', thumbSrc:'assets/img/Parametric Fun/Content/KOch.gif', ratio:321/856 },
  { title:'Sierpinski Triangle', subtitle:'Parametric Camp Youtube Channel', thumbSrc:'assets/img/Parametric Fun/Content/Serend.gif', ratio:600/1590 }
];

// Mosaic over a 12-column grid: spans follow each image's orientation, and every
// tile's frame ratio comes from its own image, so crops stay shallow. These GIFs
// are tall strips, so they get narrow slots and a generous height allowance.
const COLS = 12;
const WIDE = 1.3;
const TALL = 0.6;
const MIN_FRAME = 0.34;
const MAX_FRAME = 2.6;
const TALL_MAX_SPAN = 4;   // extreme portraits stay narrow
const MAX_ROW_H = 11;      // row height ceiling, in column units
const MIN_ROW_H = 3.2;     // row height floor, so no row reads as thumbnails

class Component extends DCLogic {
  state = { viewEntered: false };
  componentDidMount() {
    requestAnimationFrame(() => this.setState({ viewEntered: true }));
  }

  evenSpans(n) {
    if (n <= 1) return [COLS];
    if (n === 2) return [6, 6];
    if (n === 3) return [4, 4, 4];
    if (n === 4) return [3, 3, 3, 3];
    return new Array(n).fill(Math.floor(COLS / n));
  }

  rowsFor(list) {
    const wide = (p) => p && p.ratio >= WIDE;
    const tall = (p) => p && p.ratio < TALL;
    const groups = [];
    let i = 0, row = 0;
    while (i < list.length) {
      const left = list.length - i;
      let spans;
      if (tall(list[i])) {
        // Extreme portraits never get widened — a wider slot would also make the
        // row taller. Split the run of tall items into evenly sized rows instead.
        let runLength = 0;
        while (list[i + runLength] && tall(list[i + runLength])) runLength += 1;
        const perRow = runLength % 4 === 0 ? 4 : (runLength % 3 === 0 ? 3 : Math.min(runLength, 4));
        const span = Math.min(TALL_MAX_SPAN, Math.floor(COLS / perRow));
        spans = new Array(Math.min(perRow, left)).fill(span);
      }
      else if (left === 1) spans = [wide(list[i]) ? 8 : 6];
      else if (wide(list[i]) && wide(list[i + 1])) spans = row % 2 ? [5, 7] : [7, 5];
      else if (wide(list[i])) spans = [8, 4];
      else if (wide(list[i + 1])) spans = [4, 8];
      else if (left === 2) spans = [6, 6];
      else spans = [4, 4, 4];
      groups.push(spans.map((s, k) => ({ item: list[i + k], span: s })));
      i += spans.length;
      row += 1;
    }
    const last = groups[groups.length - 1];
    if (groups.length > 1 && last.length === 1 && !tall(last[0].item)) {
      const orphan = groups.pop();
      const merged = groups.pop().concat(orphan);
      const spans = this.evenSpans(merged.length);
      groups.push(merged.map((c, k) => ({ item: c.item, span: spans[k] })));
    }
    return groups;
  }

  cellsFor(list) {
    const out = [];
    this.rowsFor(list).forEach((row) => {
      const widths = row.map((c) => c.span);
      let h = row.reduce((sum, c, k) => sum + widths[k] / c.item.ratio, 0) / row.length;
      h = Math.min(h, Math.min.apply(null, widths) / MIN_FRAME);
      h = Math.max(h, Math.max.apply(null, widths) / MAX_FRAME);
      h = Math.min(h, MAX_ROW_H); // absolute cap, so no row towers over the others
      h = Math.max(h, MIN_ROW_H); // absolute floor, so no row shrinks to thumbnails
      row.forEach((c, k) => out.push({ span: c.span, frameRatio: widths[k] / h }));
    });
    return out;
  }

  renderVals() {
    const cells = this.cellsFor(ITEMS);
    const viewStyle = this.state.viewEntered
      ? 'opacity:1;transform:translateY(0);transition:opacity .55s ease,transform .55s ease;'
      : 'opacity:0;transform:translateY(20px);transition:opacity .55s ease,transform .55s ease;';
    return {
      items: ITEMS.map((p, i) => ({
        ...p,
        thumbId: 'pf-thumb-' + i,
        span: cells[i].span,
        frameRatio: cells[i].frameRatio.toFixed(4)
      })),
      viewStyle
    };
  }
}
</script>
</body>
</html>
